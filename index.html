<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agriculture is easy — สมุดบันทึกเกษตรกร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3A2E;
    --forest-2:#28503D;
    --soil:#4A3728;
    --leaf:#6B8E4E;
    --leaf-2:#557a3c;
    --sun:#E3A83B;
    --paper:#F3EFE3;
    --paper-2:#EAE3D2;
    --rust:#B5502E;
    --ink:#2B2620;
    --ink-soft:#5b5346;
    --line:#c9bfa4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--sun);color:var(--forest);}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}}

  /* ---------- layout shells ---------- */
  #root{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ---------- top nav ---------- */
  .topbar{
    background:var(--forest);
    color:var(--paper);
    border-bottom:4px solid var(--sun);
  }
  .topbar-inner{
    max-width:1080px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.25rem;letter-spacing:.2px;}
  .brand-mark{width:34px;height:34px;flex:0 0 auto;}
  .nav-tabs{display:flex;gap:4px;background:rgba(0,0,0,.18);padding:4px;border-radius:10px;}
  .nav-tab{
    background:transparent;border:none;color:var(--paper);
    padding:8px 14px;border-radius:7px;font-size:.92rem;font-weight:600;
    opacity:.75;transition:.15s;
  }
  .nav-tab.active{background:var(--sun);color:var(--forest);opacity:1;}
  .nav-tab:hover{opacity:1;}
  .user-chip{display:flex;align-items:center;gap:10px;font-size:.85rem;}
  .logout-btn{
    background:transparent;border:1px solid rgba(243,239,227,.4);color:var(--paper);
    padding:6px 12px;border-radius:7px;font-size:.8rem;
  }
  .logout-btn:hover{background:rgba(243,239,227,.12);}
  .music-toggle-btn{white-space:nowrap;font-size:.78rem;}

  /* ---------- landing / auth ---------- */
  .hero{
    background:
      radial-gradient(circle at 15% 20%, rgba(227,168,59,.16), transparent 45%),
      var(--forest);
    color:var(--paper);
    padding:72px 24px 90px;
    position:relative;
    overflow:hidden;
    border-bottom:6px dashed var(--soil);
  }
  .hero-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;}
  @media (max-width:820px){.hero-inner{grid-template-columns:1fr;}}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;
    font-size:.75rem;color:var(--sun);margin-bottom:14px;display:block;
  }
  .hero h1{font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.08;margin:0 0 18px;font-weight:700;}
  .hero h1 em{font-style:italic;color:var(--sun);}
  .hero p{font-size:1.05rem;color:#dbe2d4;max-width:46ch;line-height:1.6;margin:0 0 28px;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:9px;padding:13px 22px;font-weight:700;font-size:.95rem;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--sun);color:var(--forest);}
  .btn-primary:hover{box-shadow:0 6px 0 0 #b8842a;transform:translateY(-2px);}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid rgba(243,239,227,.5);}
  .btn-ghost:hover{background:rgba(243,239,227,.1);}
  .btn-block{width:100%;}

  .hero-card{
    background:var(--paper);color:var(--ink);border-radius:14px;
    padding:26px;box-shadow:0 20px 40px rgba(0,0,0,.28);
    border:1px solid var(--line);
  }
  .ring-badge{
    width:64px;height:64px;border-radius:50%;
    background:conic-gradient(var(--leaf) 0turn, var(--sun) .5turn, var(--leaf) 1turn);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .ring-badge-inner{width:48px;height:48px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}

  /* ---------- auth forms ---------- */
  .auth-shell{
    flex:1;display:flex;align-items:center;justify-content:center;
    background:var(--paper);
    padding:40px 20px;
  }
  .auth-card{
    width:100%;max-width:400px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:32px 28px;box-shadow:0 12px 30px rgba(43,38,32,.08);
  }
  .auth-card h2{margin:4px 0 6px;font-size:1.5rem;}
  .auth-card .sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--soil);}
  .field input{
    width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);
    font-family:inherit;font-size:.95rem;background:var(--paper);
  }
  .field input:focus{border-color:var(--leaf);}
  .form-msg{font-size:.85rem;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .form-msg.err{background:#f7e3da;color:var(--rust);}
  .form-msg.ok{background:#e7efdc;color:var(--leaf-2);}
  .switch-line{margin-top:18px;text-align:center;font-size:.88rem;color:var(--ink-soft);}
  .switch-line button{background:none;border:none;color:var(--leaf-2);font-weight:700;text-decoration:underline;padding:0;}

  /* ---------- main app content ---------- */
  main{flex:1;}
  .section{padding:40px 24px 60px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
  .section-head h2{margin:0;font-size:1.7rem;}
  .section-head .count{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--ink-soft);}

  .search-row{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap;}
  .search-row input{
    flex:1;min-width:200px;padding:11px 14px;border-radius:9px;border:1.5px solid var(--line);
    font-family:inherit;background:#fff;
  }
  .chip-filter{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;
    font-size:.82rem;font-weight:600;color:var(--ink-soft);
  }
  .chip.active{background:var(--leaf);color:#fff;border-color:var(--leaf);}

  .plant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
  .plant-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;cursor:pointer;
  }
  .plant-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(43,38,32,.12);}
  .plant-top{
    background:linear-gradient(135deg,var(--forest-2),var(--forest));
    color:var(--paper);padding:18px;position:relative;
  }
  .plant-code{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--sun);letter-spacing:.08em;}
  .plant-emoji{font-size:2.1rem;margin:6px 0 2px;}
  .plant-name{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;}
  .plant-name-en{font-size:.75rem;color:#c7d2bb;font-style:italic;}
  .plant-body{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:8px;}
  .plant-tag{display:inline-block;font-size:.72rem;background:var(--paper-2);color:var(--soil);padding:3px 9px;border-radius:12px;width:fit-content;}
  .plant-body p{margin:0;font-size:.85rem;color:var(--ink-soft);line-height:1.5;}

  /* plant detail modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(31,58,46,.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .modal{
    background:var(--paper);border-radius:16px;max-width:560px;width:100%;
    max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .modal-head{
    background:var(--forest);color:var(--paper);padding:22px 24px;position:sticky;top:0;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .modal-close{background:none;border:none;color:var(--paper);font-size:1.4rem;line-height:1;padding:2px 6px;}
  .modal-body{padding:22px 24px 28px;}
  .modal-block{margin-bottom:20px;}
  .modal-block h4{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:.72rem;
    letter-spacing:.1em;color:var(--leaf-2);margin:0 0 10px;
  }
  .care-list{margin:0;padding-left:18px;color:var(--ink-soft);font-size:.9rem;line-height:1.7;}
  .disease-card{border:1px solid var(--line);border-left:4px solid var(--rust);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .disease-card h5{margin:0 0 4px;font-size:.95rem;font-family:'Fraunces',serif;}
  .disease-card p{margin:2px 0;font-size:.83rem;color:var(--ink-soft);}
  .disease-card p b{color:var(--ink);}

  /* ---------- weather ---------- */
  .weather-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:24px;}
  .weather-now{display:flex;align-items:center;gap:14px;}
  .weather-now-icon{font-size:2.4rem;}
  .weather-now-temp{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;}
  .weather-now-desc{font-size:.85rem;color:var(--ink-soft);}
  .weather-now-meta{margin-left:auto;text-align:right;font-size:.78rem;color:var(--ink-soft);}
  .weather-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .weather-day{text-align:center;background:var(--paper-2);border-radius:10px;padding:8px 4px;}
  .reminder-banner{background:#fdf3e4;border:1px solid #eccf9b;border-radius:12px;padding:14px 16px;margin-bottom:22px;}
  .reminder-banner h4{margin:0 0 8px;font-size:.85rem;color:#a3721f;}
  .reminder-item{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;padding:5px 0;}
  .reminder-item b{color:var(--ink);}

  /* ---------- plot detail: finance & photos ---------- */
  .detail-tabs{display:flex;gap:4px;background:var(--paper-2);padding:4px;border-radius:10px;margin-bottom:18px;}
  .detail-tab{flex:1;background:transparent;border:none;padding:9px 8px;border-radius:7px;font-size:.85rem;font-weight:600;color:var(--ink-soft);}
  .detail-tab.active{background:var(--forest);color:var(--paper);}
  .finance-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .finance-box{background:var(--paper-2);border-radius:10px;padding:12px 8px;text-align:center;}
  .finance-box .label{font-size:.7rem;color:var(--ink-soft);}
  .finance-box .value{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1rem;margin-top:4px;}
  .finance-box.income .value{color:var(--leaf-2);}
  .finance-box.expense .value{color:var(--rust);}
  .tx-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem;}
  .tx-row:last-child{border-bottom:none;}
  .tx-row .tx-desc{font-weight:600;}
  .tx-row .tx-date{font-size:.72rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .tx-row .tx-amount.income{color:var(--leaf-2);font-weight:700;}
  .tx-row .tx-amount.expense{color:var(--rust);font-weight:700;}
  .tx-row .tx-del{background:none;border:none;color:var(--ink-soft);font-size:.9rem;padding:2px 6px;}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:14px;}
  .photo-thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .photo-thumb .photo-date{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;padding:3px 5px;text-align:center;}
  .photo-thumb .photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:.7rem;line-height:1;}
  .photo-enlarge-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
  .photo-enlarge-backdrop img{max-width:100%;max-height:85vh;border-radius:10px;}

  /* ---------- plot management ---------- */
  .plot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}
  .plot-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;}
  .plot-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .plot-card-head h3{margin:0;font-size:1.1rem;font-family:'Fraunces',serif;}
  .plot-status{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap;}
  .plot-status.growing{background:#e7efdc;color:var(--leaf-2);}
  .plot-status.harvest-soon{background:#fdf3e4;color:#a3721f;}
  .plot-status.harvested{background:var(--paper-2);color:var(--soil);}
  .plot-meta{font-size:.83rem;color:var(--ink-soft);line-height:1.6;margin:0;}
  .plot-meta b{color:var(--ink);}
  .plot-notes{font-size:.82rem;color:var(--ink-soft);background:var(--paper-2);border-radius:8px;padding:8px 10px;margin:4px 0 0;}
  .plot-actions{display:flex;gap:8px;margin-top:8px;}
  .plot-actions button{flex:1;font-size:.8rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;}
  .plot-actions button.danger{color:var(--rust);border-color:#e6c3b5;}
  .plot-actions button:hover{background:var(--paper-2);}
  .add-plot-card{
    border:2px dashed var(--leaf);border-radius:14px;background:var(--paper-2);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    padding:30px 18px;color:var(--leaf-2);font-weight:700;cursor:pointer;min-height:140px;
  }
  .add-plot-card:hover{background:#e7efdc;}
  .plot-form-field{margin-bottom:14px;}
  .plot-form-field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--soil);}
  .plot-form-field input,.plot-form-field select,.plot-form-field textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);
    font-family:inherit;font-size:.92rem;background:var(--paper);
  }
  .plot-form-field textarea{resize:vertical;min-height:70px;}
  .plot-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.plot-form-row{grid-template-columns:1fr;}}

  /* ---------- scan section ---------- */
  .scan-shell{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media (max-width:820px){.scan-shell{grid-template-columns:1fr;}}
  .scan-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;}
  .drop-zone{
    border:2px dashed var(--leaf);border-radius:14px;padding:34px 18px;text-align:center;
    background:var(--paper-2);position:relative;
  }
  .drop-zone img{max-width:100%;max-height:260px;border-radius:10px;margin-top:12px;}
  .drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .scan-icon{font-size:2.2rem;}
  .rings{position:relative;width:120px;height:120px;margin:14px auto;}
  .ring{
    position:absolute;border:3px solid var(--leaf);border-radius:50%;
    left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;
    animation:ringpulse 2.1s ease-out infinite;
  }
  .ring:nth-child(2){animation-delay:.5s;border-color:var(--sun);}
  .ring:nth-child(3){animation-delay:1s;border-color:var(--rust);}
  @keyframes ringpulse{
    0%{width:14px;height:14px;opacity:.9;}
    100%{width:118px;height:118px;opacity:0;}
  }
  .result-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;}
  .result-empty{color:var(--ink-soft);font-size:.9rem;text-align:center;padding:40px 10px;}
  .result-tag{display:inline-block;background:var(--leaf);color:#fff;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:12px;margin-bottom:10px;}
  .result-tag.warn{background:var(--rust);}
  .result-title{font-family:'Fraunces',serif;font-size:1.3rem;margin:0 0 4px;}
  .result-conf{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);margin-bottom:16px;}
  .result-section{margin-bottom:14px;}
  .result-section h5{margin:0 0 4px;font-size:.82rem;color:var(--soil);font-weight:700;}
  .result-section p{margin:0;font-size:.88rem;line-height:1.6;color:var(--ink-soft);}

  /* ---------- mascot chat ---------- */
  .mascot-btn{
    position:fixed;right:22px;bottom:22px;width:64px;height:64px;border-radius:50%;
    background:var(--sun);border:3px solid var(--forest);box-shadow:0 10px 24px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;font-size:1.7rem;z-index:70;
    animation:bob 3.2s ease-in-out infinite;overflow:visible;
  }
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .mascot-btn:hover{filter:brightness(1.05);}

  /* น้อง Agri แอนิเมชัน: ตากะพริบ ใบไม้ไหว แขนโบก แก้มเปล่งแสง */
  .radish-mascot .radish-eyes{transform-origin:32px 28px;animation:radishBlink 4.2s infinite;}
  @keyframes radishBlink{0%,90%,100%{transform:scaleY(1);}93%,96%{transform:scaleY(.12);}}
  .radish-mascot .radish-leaves{transform-origin:32px 14px;animation:radishLeafSway 2.8s ease-in-out infinite;}
  @keyframes radishLeafSway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .radish-mascot .radish-cheek{animation:radishCheekGlow 2.4s ease-in-out infinite;}
  @keyframes radishCheekGlow{0%,100%{opacity:.55;}50%{opacity:.95;}}
  .radish-mascot .radish-arm{transform-origin:top center;animation:radishWave 1.8s ease-in-out infinite;}
  .radish-mascot .radish-arm-l{transform-origin:20px 40px;animation-delay:.15s;}
  .radish-mascot .radish-arm-r{transform-origin:44px 40px;}
  @keyframes radishWave{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-14deg);}}

  /* ประกายดาวลอยฟุ้งรอบปุ่มมาสคอต */
  .mascot-btn::before,.mascot-btn::after{
    content:'✨';position:absolute;font-size:.9rem;opacity:0;pointer-events:none;
    animation:sparkleFloat 3.6s ease-in-out infinite;
  }
  .mascot-btn::before{left:-6px;top:6px;animation-delay:.4s;}
  .mascot-btn::after{right:-4px;bottom:10px;animation-delay:1.8s;}
  @keyframes sparkleFloat{
    0%{opacity:0;transform:translateY(4px) scale(.6);}
    30%{opacity:1;}
    100%{opacity:0;transform:translateY(-22px) scale(1.1);}
  }
  @media (prefers-reduced-motion:reduce){
    .mascot-btn{animation:none;}
    .radish-mascot .radish-eyes,.radish-mascot .radish-leaves,.radish-mascot .radish-cheek,.radish-mascot .radish-arm,.mascot-btn::before,.mascot-btn::after{animation:none;}
  }

  .chat-panel{
    position:fixed;right:22px;bottom:98px;width:340px;max-width:90vw;height:460px;max-height:70vh;
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;z-index:70;overflow:hidden;
  }
  .chat-head{background:var(--forest);color:var(--paper);padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .chat-head .name{font-family:'Fraunces',serif;font-weight:700;}
  .chat-head .role{font-size:.7rem;color:#c7d2bb;}
  .chat-close{margin-left:auto;background:none;border:none;color:var(--paper);font-size:1.2rem;}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* ================= เพลงพื้นหลัง (สร้างเสียงเอง ไม่มีลิขสิทธิ์) ================= */
let musicCtx = null, musicMasterGain = null, musicOscillators = [], musicPluckTimer = null;

function ensureMusicCtx(){
  if(!musicCtx){ musicCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(musicCtx.state === 'suspended') musicCtx.resume();
  return musicCtx;
}

function startMusic(){
  const ctx = ensureMusicCtx();
  musicMasterGain = ctx.createGain();
  musicMasterGain.gain.value = 0;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1100;
  musicMasterGain.connect(filter);
  filter.connect(ctx.destination);
  musicMasterGain.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 2.5);

  // แพดเสียงคลอเบาๆ (คอร์ด C เมเจอร์ โทนอบอุ่นแบบทุ่งนายามเช้า)
  const padFreqs = [130.81, 164.81, 196.00, 261.63];
  musicOscillators = padFreqs.map((f,i)=>{
    const osc = ctx.createOscillator();
    osc.type = i%2===0 ? 'sine' : 'triangle';
    osc.frequency.value = f;
    const g = ctx.createGain();
    g.gain.value = 0.55/padFreqs.length;
    osc.connect(g); g.connect(musicMasterGain);
    osc.start();
    return osc;
  });

  // LFO ทำให้เสียงคลอไหวเบาๆ ไม่นิ่งจนน่าเบื่อ
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.045;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 350;
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
  lfo.start();
  musicOscillators.push(lfo);

  // เสียงเมโลดี้เบาๆ แบบมาริมบา สุ่มเล่นเป็นระยะ (คีย์เพนตาโทนิก ให้ความรู้สึกสดชื่นแบบทุ่งเกษตร)
  const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
  function pluckNote(){
    if(!musicCtx || !musicMasterGain) return;
    const freq = pentatonic[Math.floor(Math.random()*pentatonic.length)];
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.value = 0;
    o.connect(g); g.connect(filter);
    const now = ctx.currentTime;
    g.gain.linearRampToValueAtTime(0.055, now+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, now+2.3);
    o.start(now); o.stop(now+2.4);
    musicPluckTimer = setTimeout(pluckNote, 2200 + Math.random()*2600);
  }
  musicPluckTimer = setTimeout(pluckNote, 1500);
}

function stopMusic(){
  if(musicPluckTimer) clearTimeout(musicPluckTimer);
  musicPluckTimer = null;
  if(musicMasterGain && musicCtx){
    const now = musicCtx.currentTime;
    musicMasterGain.gain.cancelScheduledValues(now);
    musicMasterGain.gain.setValueAtTime(musicMasterGain.gain.value, now);
    musicMasterGain.gain.linearRampToValueAtTime(0, now+1);
  }
  const oscsToStop = musicOscillators;
  musicOscillators = [];
  setTimeout(()=>{ oscsToStop.forEach(o=>{ try{o.stop();}catch(e){} }); }, 1100);
}

function toggleMusic(){
  state.musicPlaying = !state.musicPlaying;
  if(state.musicPlaying) startMusic(); else stopMusic();
  updateMusicButtons();
}

/* ================= HELPERS ================= */
function esc(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function sheetRequest(payload){
  // ใช้ Content-Type: text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
  const res = await fetch(SHEET_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const raw = await res.text();
  try{
    return JSON.parse(raw);
  }catch(parseErr){
    throw new Error('HTTP '+res.status+' — ตอบกลับไม่ใช่ JSON: '+raw.slice(0,200));
  }
}

// เรียก AI ผ่าน Serverless Function ของเว็บเราเอง (/api/claude) แทนที่จะยิงตรงไปหา Anthropic
// วิธีนี้คีย์ API จะถูกซ่อนไว้ในฝั่งเซิร์ฟเวอร์ (Environment Variable บน Vercel) ไม่ปรากฏในโค้ดหน้าเว็บเลย
async function callClaude(messages, system, maxTokens){
  const res = await fetch("/api/claude", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      max_tokens: maxTokens || 1000,
      system: system || undefined,
      messages
    })
  });
  const data = await res.json();
  if(data.error){ throw new Error(data.error.message || data.error || 'Anthropic API error'); }
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  return text;
}

function plotStatusInfo(plot){
  const days = plot.plantedDate ? Math.floor((Date.now()-new Date(plot.plantedDate).getTime())/86400000) : null;
  let cls='growing', label='กำลังเจริญเติบโต';
  if(plot.status==='เก็บเกี่ยวแล้ว'){ cls='harvested'; label='เก็บเกี่ยวแล้ว'; }
  else if(plot.status==='ใกล้เก็บเกี่ยว'){ cls='harvest-soon'; label='ใกล้เก็บเกี่ยว'; }
  else if(plot.status){ label = plot.status; }
  return {days, cls, label};
}

function daysSinceDate(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.floor((today-d)/86400000);
}

function plotReminderInfo(plot){
  const waterDays = daysSinceDate(plot.lastWateredDate);
  const fertDays = daysSinceDate(plot.lastFertilizedDate);
  const waterInterval = Number(plot.wateringIntervalDays)||0;
  const fertInterval = Number(plot.fertilizingIntervalDays)||0;
  const waterDue = waterInterval>0 && (waterDays===null || waterDays >= waterInterval);
  const fertDue = fertInterval>0 && (fertDays===null || fertDays >= fertInterval);
  return {waterDue, fertDue, waterDays, fertDays, waterInterval, fertInterval};
}

  if(!state.plots.length) return '';

/* ================= พยากรณ์อากาศ (Open-Meteo — ฟรี ไม่ต้องใช้ API Key) ================= */
function weatherCodeInfo(code){
  const map = {
    0:['☀️','ท้องฟ้าแจ่มใส'],1:['🌤️','มีเมฆบางส่วน'],2:['⛅','เมฆเป็นบางส่วน'],3:['☁️','มีเมฆมาก'],
    45:['🌫️','หมอก'],48:['🌫️','หมอกน้ำแข็ง'],
    51:['🌦️','ฝนปรอยเบา'],53:['🌦️','ฝนปรอยปานกลาง'],55:['🌧️','ฝนปรอยหนัก'],
    61:['🌧️','ฝนตกเบา'],63:['🌧️','ฝนตกปานกลาง'],65:['🌧️','ฝนตกหนัก'],
    80:['🌦️','ฝนซู่เบา'],81:['🌧️','ฝนซู่ปานกลาง'],82:['⛈️','ฝนซู่หนัก'],
    95:['⛈️','พายุฝนฟ้าคะนอง'],96:['⛈️','พายุฝนฟ้าคะนองมีลูกเห็บ'],99:['⛈️','พายุฝนฟ้าคะนองรุนแรง']
  };
  return map[code] || ['🌡️','ไม่ทราบสภาพอากาศ'];
}
const THAI_WEEKDAYS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

async function loadWeather(){
  state.weatherLoading=true; state.weatherError=null; render();
  try{
    if(!navigator.geolocation) throw new Error('เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง');
    const pos = await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:10000, maximumAge:600000});
    });
    const {latitude, longitude} = pos.coords;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.reason || 'โหลดข้อมูลอากาศไม่สำเร็จ');
    state.weather = data;
  }catch(e){
    console.error(e);
    let msg = e && e.message ? e.message : String(e);
    if(e && e.code === 1) msg = 'กรุณาอนุญาตการเข้าถึงตำแหน่งเพื่อดูพยากรณ์อากาศ';
    state.weatherError = msg;
  }
  state.weatherLoading=false;
  render();
}

function renderWeatherCard(){
  if(state.weatherLoading){
    return `<div class="weather-card"><div class="result-empty" style="padding:20px 0;">กำลังโหลดพยากรณ์อากาศ...</div></div>`;
  }
  if(state.weatherError){
    return `<div class="weather-card">
      <div class="form-msg err" style="margin:0;">${esc(state.weatherError)}</div>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="loadWeather()">ลองอีกครั้ง</button>
    </div>`;
  }
  if(!state.weather) return '';
  const cur = state.weather.current;
  const daily = state.weather.daily;
  const [curIcon, curDesc] = weatherCodeInfo(cur.weather_code);
  const rainSoon = daily && daily.precipitation_probability_max && daily.precipitation_probability_max[0] >= 60;
  return `
  <div class="weather-card">
    <div class="weather-now">
      <div class="weather-now-icon">${curIcon}</div>
      <div>
        <div class="weather-now-temp">${Math.round(cur.temperature_2m)}°C</div>
        <div class="weather-now-desc">${esc(curDesc)}</div>
      </div>
      <div class="weather-now-meta mono">
        <div>💧 ${cur.relative_humidity_2m}%</div>
        <div>🌬️ ${Math.round(cur.wind_speed_10m)} กม./ชม.</div>
      </div>
    </div>
    ${rainSoon? `<div class="disclaimer" style="margin-top:0;">☔ พรุ่งนี้มีโอกาสฝนตกสูง (${daily.precipitation_probability_max[0]}%) อาจไม่ต้องรดน้ำเพิ่ม</div>` : ''}
    <div class="weather-days">
      ${daily.time.slice(0,4).map((d,i)=>{
        const [icon] = weatherCodeInfo(daily.weather_code[i]);
        const wd = THAI_WEEKDAYS[new Date(d).getDay()];
        return `<div class="weather-day">
          <div class="mono" style="font-size:.72rem;color:var(--ink-soft);">${i===0?'วันนี้':wd}</div>
          <div style="font-size:1.3rem;">${icon}</div>
          <div style="font-size:.78rem;"><b>${Math.round(daily.temperature_2m_max[i])}°</b> <span style="color:var(--ink-soft);">${Math.round(daily.temperature_2m_min[i])}°</span></div>
          <div class="mono" style="font-size:.68rem;color:#4f8fce;">💧${daily.precipitation_probability_max[i]}%</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

async function loadPlots(){

  }

async function savePlotForm(existingId){
  const name = document.getElementById('pf-name').value.trim();
  const crop = document.getElementById('pf-crop').value.trim();
  const area = document.getElementById('pf-area').value.trim();
  const plantedDate = document.getElementById('pf-date').value;
  const status = document.getElementById('pf-status').value;
  const notes = document.getElementById('pf-notes').value.trim();
  const wateringIntervalDays = document.getElementById('pf-water-interval').value.trim();
  const fertilizingIntervalDays = document.getElementById('pf-fert-interval').value.trim();
  if(!name){ state.plotsError='กรุณากรอกชื่อแปลง'; return render(); }
  state.plotSaving=true; state.plotsError=null; render();
  const existing = state.editingPlot || {};
  const plot = {
    id: existingId||'', name, crop, area, plantedDate, status, notes,
    wateringIntervalDays, fertilizingIntervalDays,
    lastWateredDate: existing.lastWateredDate||'', lastFertilizedDate: existing.lastFertilizedDate||''
  };
  try{
    const action = existingId? 'updatePlot' : 'addPlot';
    const result = await sheetRequest({ action, username: state.currentUser, plot });
    if(!result.success){ state.plotsError = result.message||'บันทึกไม่สำเร็จ'; state.plotSaving=false; return render(); }
    state.plotSaving=false;
    state.plotFormOpen=false; state.editingPlot=null;
    await loadPlots();
  }catch(e){
    console.error(e);
    state.plotsError = 'เชื่อมต่อ Google Sheet ไม่สำเร็จ: '+(e&&e.message?e.message:e);
    state.plotSaving=false;
    render();
  }
}

// ย่อขนาดรูปด้วย canvas ก่อนแปลงเป็น base64 เพื่อให้ไม่เกินขนาดเซลล์ของ Google Sheet
function resizeImageFile(file, maxWidth){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function searchPlantAI(term){
  term = (term||'').trim();
  if(!term || state.aiSearchBusy) return;
  state.aiSearchBusy=true; state.aiSearchError=null; render();
  try{
    const prompt = `คุณคือผู้เชี่ยวชาญด้านพืชสวนของเว็บไซต์ "Agriculture is easy" ผู้ใช้ค้นหาพืชชื่อ "${term}" จงตอบกลับเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอกเหนือ JSON ห้ามใส่ backticks โดยใช้โครงสร้างนี้:
{"name":"ชื่อพืชภาษาไทย","nameEn":"ชื่อภาษาอังกฤษ","emoji":"อิโมจิ 1 ตัวที่ใกล้เคียงพืชนี้ที่สุด","cat":"หมวดหมู่สั้นๆ เช่น ผัก/ผลไม้/ไม้ดอก/ไม้ยืนต้น/ธัญพืช","tag":"คุณสมบัติเด่นสั้นๆ ไม่เกิน 3 คำ","desc":"คำอธิบายสั้น 1 ประโยค","care":["วิธีดูแลรักษา 4 ข้อ เป็นข้อความภาษาไทย"],"diseases":[{"name":"ชื่อโรคหรือแมลงศัตรูพืชที่พบบ่อย","symptoms":"อาการที่พบ","treat":"วิธีรักษาหรือป้องกัน"}]}
ถ้าไม่ใช่ชื่อพืชหรือไม่รู้จัก ให้ตอบ {"error":"ไม่พบข้อมูลพืชชนิดนี้"}`;
    const text = await callClaude([{ role:'user', content: prompt }], null, 900);
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(parsed.error){ state.aiSearchError = parsed.error; state.aiSearchBusy=false; return render(); }
    const code = 'AI-' + Date.now();
    AI_PLANT_CACHE[code] = {
      code, name: parsed.name||term, nameEn: parsed.nameEn||'', emoji: parsed.emoji||'🌿',
      cat: parsed.cat||'อื่นๆ', tag: parsed.tag||'ข้อมูลจาก AI', desc: parsed.desc||'',
      care: Array.isArray(parsed.care)? parsed.care : [], diseases: Array.isArray(parsed.diseases)? parsed.diseases : [],
      aiGenerated: true
    };
    state.aiSearchBusy=false;
    state.activePlant = code;
  }catch(e){
    console.error(e);
    state.aiSearchError = 'ค้นหาข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
    state.aiSearchBusy=false;
  }
  render();
}

function toggleVoice(){

function speakThai(text){
  if(!state.voiceEnabled || !text) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'th-TH';
    utter.rate = 1;
    utter.pitch = 1.15;
    const voices = window.speechSynthesis.getVoices();
    const thVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('th'));
    if(thVoice) utter.voice = thVoice;
    window.speechSynthesis.speak(utter);
  }catch(e){ console.error(e); }
}

function onScanFile(evt){

  if(!file) return;
  const reader = new FileReader();

    state.scanImage = {dataUrl, base64, mediaType:file.type||'image/jpeg'};
    state.scanResult=null; state.scanError=null;

  state.scanBusy=true; state.scanError=null; state.scanResult=null; render();
  try{
    const prompt = `คุณคือผู้เชี่ยวชาญด้านพืชสวนและโรคพืชของเว็บไซต์ "Agriculture is easy" จงดูภาพต้นพืชนี้แล้วตอบกลับเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอกเหนือจาก JSON ห้ามใส่ backticks โดยใช้โครงสร้างดังนี้:
{"plant_name":"ชื่อพืชภาษาไทย (ถ้าทราบ)","confidence":"สูง/ปานกลาง/ต่ำ","symptoms_observed":"อาการที่สังเกตเห็นจากภาพ","disease_risk":"ชื่อโรคหรือแมลงที่อาจเป็นไปได้ หรือ 'ไม่พบ' หากดูปกติดี","care_advice":"คำแนะนำการดูแลหรือรักษาโดยย่อ เป็นภาษาไทย กระชับ 2-4 ประโยค"}`;
    const text = await callClaude([
      { role:"user", content:[
        { type:"image", source:{ type:"base64", media_type: state.scanImage.mediaType, data: state.scanImage.base64 } },
        { type:"text", text: prompt }
      ]}
    ], null, 700);
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    state.scanResult = parsed;
  }catch(e){
    console.error(e);
    state.scanError = 'ขออภัยค่ะ ไม่สามารถวิเคราะห์ภาพได้ในขณะนี้ กรุณาลองใหม่อีกครั้ง';
  }
  state.scanBusy=false;
  render();
}

async function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || state.chatBusy) return;
  state.chatLog.push({role:'user', text});
  state.chatBusy=true;
  render();
  try{
    const system = "คุณคือ 'น้อง Agri' มาสคอต AI ผู้ช่วยของเว็บไซต์ 'Agriculture is easy' บุคลิกเป็นมิตร ร่าเริง ให้กำลังใจเกษตรกร ตอบเป็นภาษาไทยเสมอ เน้นตอบเรื่องการเกษตร พันธุ์พืช การดูแลรักษา และโรคพืชเท่านั้น ตอบกระชับ อ่านง่าย ไม่เกิน 5-6 ประโยค ใช้คำลงท้ายสุภาพเช่น 'ค่ะ' และอาจแทรกอิโมจิที่เกี่ยวกับพืชเล็กน้อยได้";
    const history = state.chatLog.slice(-8).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
    const reply = await callClaude(history, system, 500);
    state.chatLog.push({role:'bot', text: reply || 'ขออภัยค่ะ น้อง Agri ตอบไม่ได้ในตอนนี้ ลองใหม่อีกครั้งนะคะ'});
  }catch(e){
    console.error(e);
    state.chatLog.push({role:'bot', text:'ขออภัยค่ะ ตอนนี้น้อง Agri เชื่อมต่อไม่ได้ ลองใหม่อีกครั้งนะคะ 🌱'});
  }
  state.chatBusy=false;
  input && (input.value='');
  render();
  const lastBot = state.chatLog[state.chatLog.length-1];
  if(lastBot && lastBot.role==='bot') speakThai(lastBot.text);
  const inp = document.getElementById('chat-input');
  if(inp) inp.focus();
}

/* ================= INIT ================= */
render();
</script>
</body>
